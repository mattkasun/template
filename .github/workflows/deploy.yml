name: Deploy to Development

on:
  workflow_dispatch:
    inputs:
      branch:
        description: "branch to deploy"
        required: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: checkout
        uses: actions/checkout@v7
        with:
          ref: ${{ inputs.branch }}
      - name: Setup go
        uses: actions/setup-go@v7
        with:
          go-version-file: ./go.mod
      - name: build
        run: |
          go build -ldflags='-w -s' .
      - name: Remote SSH Deploy Action
        uses: built-for-dx/remote-deploy-action@v1
        with:
          source: ./README.md
          target: /tmp/README.md
          host: 10.10.10.115
          username: debian
          key: ${{ secrets.SSH_KEY }}
          proxy_host: nusak.ca
          proxy_username: debian
          proxy_key_path: /home/debian/.ssh/id_ed25519
          script: |
            sudo systemctl stop golf
            sudo cp /tmp/README.md /tmp/README.2.md
            sudo systemctl start golf
